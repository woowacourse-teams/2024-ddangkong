name: Webhook on Push

on:
  schedule:
    - cron: "0 14 * * *" # 한국 시간 기준 매일 밤 11시 실행

jobs:
  review-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Send Reminder to Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.PROGRESS_ALARM_DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commitSummary = {};
            const nicknames = {
              "rbgksqkr": "마루",
              "useon": "썬데이",
              "PgmJun": "이든",
              "novice0840": "포메",
              "GIVEN53": "프린",
              "leegwichan": "커찬",
              "jhon3242": "타칸"
            };

            async function getCommits(owner, repo, branch) {
              try {
                const now = new Date();
                const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
                const startOfYesterday = new Date(startOfToday.getTime() - 24 * 60 * 60 * 1000);

                const commits = await github.rest.repos.listCommits({
                  owner,
                  repo,
                  sha: branch,
                  since: startOfYesterday.toISOString(), // 어제 자정 기준 (UTC)
                  until: startOfToday.toISOString() // 오늘 자정 기준 (UTC)
                });
                return commits.data;
              } catch (error) {
                console.error(`Error fetching commits for branch ${branch}:`, error.message);
                return [];
              }
            }

            try {
              const pullRequests = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
              });

              for (const pr of pullRequests.data) {
                const branch = pr.head.ref;
                const commits = await getCommits(owner, repo, branch);

                const author = pr.user.login;
                const nickname = nicknames[author]; 

                if (!nickname) continue;

                const prTitle = pr.title; 
                const commitCount = commits.length; 

                if (commitCount === 0) continue; 

                if (commitSummary[nickname]) {
                  commitSummary[nickname].push(`${prTitle}: 커밋 수: ${commitCount}`);
                } else {
                  commitSummary[nickname] = [`${prTitle}: 커밋 수: ${commitCount}`];
                }
              }

              const messageList = Object.keys(commitSummary).map(nickname => {
                const prSummaries = commitSummary[nickname].join('\n');
                return `${nickname}\n${prSummaries}`;
              });

              if (messageList.length === 0) {
                console.log('오늘의 커밋이 없습니다.');
                return;
              }

              const response = await fetch(process.env.DISCORD_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  content: `🍀 오늘의 커밋 요약 🍀\n\n${messageList.join('\n\n')}`,
                  allowed_mentions: {
                    parse: ["users"], // 멘션 가능한 사용자만 허용
                  },
                }),
              });
              
              console.log('Response status:', response.status);
            } catch (error) {
              console.error('Error fetching pull requests:', error.message);
              throw error;
            }
